<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reference template — 16:9 thumb (thumb.svg, backdrop.svg)
  Canvas:    1024 x 576 px
  Safe area: 864 x 416 px (80px inset)
  Background must hit WCAG AA contrast (>=4.5:1) against logo content.
  See templates/README.md for alignment instructions.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 576"
     width="1024" height="576"
     role="img" aria-label="Jellyfin artwork template (1024x576 / 16:9)">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1024" height="576" fill="#1a1a1a"/>
  <rect width="1024" height="576" fill="url(#grid)"/>

  <!-- Outer hairline border (canvas edge) -->
  <rect x="0.5" y="0.5" width="1023" height="575" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Safe area — 80px inset on every side -->
  <rect x="80" y="80" width="864" height="416"
        fill="none" stroke="#4cc4ff" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- Center crosshair -->
  <line x1="512" y1="80"  x2="512" y2="496" stroke="#4cc4ff" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="80"  y1="288" x2="944" y2="288" stroke="#4cc4ff" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <circle cx="512" cy="288" r="6" fill="none" stroke="#4cc4ff" stroke-width="1.5"/>
  <circle cx="512" cy="288" r="1.5" fill="#4cc4ff"/>

  <!-- Corner markers (rule-of-thirds intersections inside safe area) -->
  <g fill="#4cc4ff" opacity="0.55">
    <circle cx="368"   cy="218.67" r="2.5"/>
    <circle cx="656"   cy="218.67" r="2.5"/>
    <circle cx="368"   cy="357.33" r="2.5"/>
    <circle cx="656"   cy="357.33" r="2.5"/>
  </g>

  <!-- Labels -->
  <g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" fill="#e0e0e0">
    <text x="16" y="28" font-size="14" font-weight="600">1024 × 576 · 16:9</text>
    <text x="1008" y="28" font-size="11" text-anchor="end" fill="#888">thumb / backdrop</text>
    <text x="512" y="560" font-size="11" text-anchor="middle" fill="#4cc4ff">
      SAFE AREA · 864 × 416 · 80 px inset
    </text>
  </g>
</svg>
