<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reference template — 1:1 primary (primary.svg, square logo card)
  Canvas:    360 x 360 px
  Safe area: 240 x 240 px  (60 px inset all sides)
  Wide-logo safe area: 280 x 240 px  (L&R inset 40 when lw > lh)
  Tall-logo safe area: 240 x 280 px  (T&B inset 40 when lh > lw)
  Background must hit WCAG AA contrast (>=4.5:1) against logo content.
  See templates/README.md for alignment instructions.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 360"
     width="360" height="360"
     role="img" aria-label="Jellyfin artwork template (360x360 / 1:1)">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="360" height="360" fill="#1a1a1a"/>
  <rect width="360" height="360" fill="url(#grid)"/>

  <!-- Outer hairline border (canvas edge) -->
  <rect x="0.5" y="0.5" width="359" height="359" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Default safe area — 60 px inset all sides -->
  <rect x="60" y="60" width="240" height="240"
        fill="none" stroke="#4cc4ff" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- Wide-logo safe area — L&R 40 when the logo is wider than tall -->
  <rect x="40" y="60" width="280" height="240"
        fill="none" stroke="#4cc4ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>

  <!-- Tall-logo safe area — T&B 40 when the logo is taller than wide -->
  <rect x="60" y="40" width="240" height="280"
        fill="none" stroke="#4cc4ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>

  <!-- Center crosshair -->
  <line x1="180" y1="60"  x2="180" y2="300" stroke="#4cc4ff" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="60"  y1="180" x2="300" y2="180" stroke="#4cc4ff" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <circle cx="180" cy="180" r="4" fill="none" stroke="#4cc4ff" stroke-width="1.5"/>
  <circle cx="180" cy="180" r="1" fill="#4cc4ff"/>

  <!-- Rule-of-thirds intersections inside the default safe area -->
  <g fill="#4cc4ff" opacity="0.55">
    <circle cx="140" cy="140" r="2"/>
    <circle cx="220" cy="140" r="2"/>
    <circle cx="140" cy="220" r="2"/>
    <circle cx="220" cy="220" r="2"/>
  </g>

  <!-- Labels -->
  <g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" fill="#e0e0e0">
    <text x="10" y="20" font-size="11" font-weight="600">360 × 360 · 1:1</text>
    <text x="350" y="20" font-size="9" text-anchor="end" fill="#888">primary</text>
    <text x="180" y="350" font-size="9" text-anchor="middle" fill="#4cc4ff">
      SAFE 240 × 240 · 60 px — wide: L&amp;R 40 · tall: T&amp;B 40
    </text>
  </g>
</svg>
