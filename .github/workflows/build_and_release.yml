name: Build & release

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: |
          npm install -g svgo
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin webp
      - name: Build release blob
        # build_release.py handles every step: lint, copy, svgo,
        # rsvg+cwebp, flatten studios.json, bundle the generic
        # placeholders, strip per-studio studio.json files, and zip.
        run: python3 scripts/build_release.py
      - name: Delete previous latest release
        env:
          GH_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.JF_BOT_TOKEN }}
          tag_name: latest
          name: latest
          prerelease: false
          make_latest: "true"
          files: dist/release.zip
