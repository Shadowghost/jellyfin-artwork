name: Build & release

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install build dependencies
        run: |
          npm install svgo
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin webp
      - name: Create dist directory
        run: mkdir dist
      - name: Copy source SVGs
        run: cp -r studios dist/
      - name: Optimize source SVGs
        run: npx svgo --multipass dist/studios/**/*.svg
      - name: Render SVG → WebP
        run: |
          set -euo pipefail
          find dist/studios -name '*.svg' -print0 \
            | xargs -0 -n1 -P"$(nproc)" -I{} sh -c '
                rsvg-convert "$1" \
                  | cwebp -quiet -o "${1%.svg}.webp" -- - \
                  || { echo "render failed: $1" >&2; exit 1; }
              ' _ {}
      - name: Build studios.json
        run: jq -s '.[0]=([.[]]|flatten)|.[0]' studios/**/studio.json > dist/studios.json
      - name: Remove individual JSON files
        run: rm dist/studios/**/studio.json
      - name: Compress built assets
        run: cd dist; zip -r -D ../release.zip *; cd ..
      - name: Delete previous latest release
        env:
          GH_TOKEN: ${{ secrets.JF_BOT_TOKEN }}
        run: gh release delete latest --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.JF_BOT_TOKEN }}
          tag_name: latest
          name: latest
          prerelease: false
          make_latest: "true"
          files: release.zip
